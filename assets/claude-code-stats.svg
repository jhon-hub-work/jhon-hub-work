<svg xmlns="http://www.w3.org/2000/svg" width="880" height="286" viewBox="0 0 880 286" role="img" aria-label="Claude Code usage: 216 sessions, 50,658 messages, 56.1M tokens, 47 active days, 15 day current streak, 15 day longest streak, peak hour 1 PM, favorite model Opus 5">
